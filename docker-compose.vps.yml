name: assembly-system

services:
  api:
    build:
      context: ./Backend
      dockerfile: Web.API/Dockerfile
    image: assembly-system-api:latest
    container_name: assembly-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${MYSQL_CONNECTION_STRING}
      Jwt__Issuer: ${JWT_ISSUER:-AssemblySystem}
      Jwt__Audience: ${JWT_AUDIENCE:-AssemblySystem.Frontend}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__ExpiresHours: ${JWT_EXPIRES_HOURS:-8}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN_ALT:-http://127.0.0.1:8091}
    ports:
      - "${API_HOST_PORT:-5274}:8080"
    networks:
      - assembly-net

  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://api:8080}
    image: assembly-system-web:latest
    container_name: assembly-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://api:8080}
    ports:
      - "${FRONTEND_HOST_PORT:-8091}:3000"
    networks:
      - assembly-net

  worker:
    profiles:
      - worker
    build:
      context: ./Backend/LeakTestWorker
      dockerfile: Dockerfile
    image: assembly-system-worker:latest
    container_name: assembly-worker
    restart: unless-stopped
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_CONNECTION_STRING: ${MYSQL_CONNECTION_STRING}
      MQTT_HOST: ${MQTT_HOST:-host.docker.internal}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-AssemblyNutRunnerWorker}
      MQTT_TOPIC: ${MQTT_TOPIC:-assembly_nutrunner_mqtt}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-1}
      WORKER_RECONNECT_DELAY_SECONDS: ${WORKER_RECONNECT_DELAY_SECONDS:-3}
    volumes:
      - assembly-worker-buffer:/app/buffer
    networks:
      - assembly-net

networks:
  assembly-net:
    driver: bridge

volumes:
  assembly-worker-buffer:
